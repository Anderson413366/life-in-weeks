<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life in Weeks</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { poppins: ['Poppins', 'sans-serif'] },
          colors: {
            'primary':      '#00d4ff',
            'primary-dark':  '#0097b5',
            'primary-glow':  'rgba(0, 212, 255, 0.3)',
            'accent':        '#ff6b6b',
            'accent-glow':   'rgba(255, 107, 107, 0.3)',
            'bg-dark':       '#0a0a23',
            'bg-light':      '#1f1f3a',
            'text-main':     '#ffffff',
            'text-muted':    '#b4b4c7',
            'box-border':    '#3a3a5e',
            'card-bg':       'rgba(25, 25, 55, 0.75)',
            'decade-marker': '#ffd700',
            'gemini-button-bg':       '#8e44ad',
            'gemini-button-hover-bg': '#732d91',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            'pulse-slow': { '0%, 100%': { opacity: '1' }, '50%': { opacity: '.7' } },
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out forwards',
            'pulse-slow': 'pulse-slow 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="/index.css" />
</head>
<body class="font-poppins bg-gradient-to-br from-bg-dark to-bg-light text-text-main flex justify-center items-start min-h-screen overflow-x-hidden antialiased">
  <div id="root" class="w-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
